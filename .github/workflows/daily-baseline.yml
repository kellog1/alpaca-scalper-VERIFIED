name: Daily baseline pipeline

on:
  schedule:
    # GitHub starts scheduled runs hours late and unpredictably: all 8 observed
    # runs of the old single 12:52 UTC trigger started 5h12m-7h57m late (18:04-20:49
    # UTC), so one trigger a day can miss the market window (13:30-20:00 UTC in
    # EDT, 14:30-21:00 in EST). Fire several, weekdays only; at least one should
    # land inside market hours whatever the delay. This is safe because a run is
    # idempotent: the market guard blocks anything outside open hours, symbols with
    # an order in flight are left alone, and only the first run per UTC day is
    # written to pipeline_log.csv.
    - cron: "52 12 * * 1-5"
    - cron: "52 14 * * 1-5"
    - cron: "52 16 * * 1-5"
    - cron: "52 18 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated pipeline_log.csv back

concurrency:
  group: baseline-logs   # shared with daily-analytics so log pushes don't race
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseline_pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Alpaca credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python check_credentials.py

      - name: Run daily pipeline
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          # Keep this "true" until you've watched several runs and trust
          # the output. Flip the repo variable (not secret) to go live.
          RUN_DAILY_DRY_RUN: ${{ vars.RUN_DAILY_DRY_RUN || 'true' }}
        run: python run_daily.py

      - name: Commit updated logs
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          git add -A data
          git diff --staged --quiet || git commit -m "Update pipeline logs"
          git push
