name: Daily trade analytics

# Read-only: pulls fills and prices, writes a report. Never places or cancels orders.
on:
  schedule:
    # 22:10 UTC weekdays = after the US close in both EST and EDT.
    - cron: "10 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write   # commit data/analytics_report.md

concurrency:
  group: baseline-logs
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baseline_pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Alpaca credentials
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python check_credentials.py

      - name: Run analytics
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python run_analytics.py

      - name: Commit report
        run: |
          git config user.name "trading-bot"
          git config user.email "actions@github.com"
          git add -A data
          git diff --staged --quiet || git commit -m "Update analytics report"
          git pull --rebase
          git push
